# Explicit opt-in for B2-17 infrastructure. No generation/ML executor is installed yet.
services:
  backend:
    environment:
      RABBITMQ_API_PASSWORD: "${RABBITMQ_API_PASSWORD:?Preencha a credencial privada da API}"
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
  generation:
    extends:
      file: compose.yaml
      service: backend
    command: [python, -m, backend.app.job_worker, --role, generation]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_GENERATION_PASSWORD: "${RABBITMQ_GENERATION_PASSWORD:?Preencha a credencial privada de geracao}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
  training:
    extends:
      file: compose.yaml
      service: backend
    command: [python, -m, backend.app.job_worker, --role, training]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_TRAINING_PASSWORD: "${RABBITMQ_TRAINING_PASSWORD:?Preencha a credencial privada de treino}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
