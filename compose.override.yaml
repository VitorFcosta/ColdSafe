# Loaded automatically with compose.yaml: the complete presentation stack.
# Explicit -f commands keep their selected composition for bootstrap/tests.
services:
  frontend:
    extends:
      file: compose.aiot.yaml
      service: frontend

  backend:
    extends:
      file: compose.aiot.yaml
      service: backend
    environment:
      RABBITMQ_API_PASSWORD: "${RABBITMQ_API_PASSWORD:?Preencha a credencial privada da API}"
      OLLAMA_URL: http://ollama:11434
    volumes:
      - "job-artifacts:/app/artifacts:ro"
      - "training-artifacts:/app/training-artifacts:ro"
    networks:
      - coldsafe-llm

  simulator:
    profiles: !reset []
  gateway:
    profiles: !reset []
  writer:
    profiles: !reset []

  generation:
    extends:
      file: compose.jobs.yaml
      service: generation
    environment:
      OLLAMA_URL: http://ollama:11434
    networks:
      - coldsafe-llm

  training:
    extends:
      file: compose.jobs.yaml
      service: training
    environment:
      OLLAMA_URL: http://ollama:11434
    networks:
      - coldsafe-llm

  models:
    extends:
      file: compose.jobs.yaml
      service: models
    command: [python, -m, backend.app.inference_worker]
    environment:
      AIOT_CATALOG_PATH: /catalog/catalog.json
      AIOT_OWNER_USER_ID: "${GATEWAY_OWNER_USER_ID:?Preencha o proprietario do catalogo AIoT}"
    volumes:
      - type: bind
        source: "${SIMULATOR_CATALOG_DIR:-./simulator/local}"
        target: /catalog
        read_only: true
        bind:
          create_host_path: false

  ollama:
    extends:
      file: compose.ollama.yaml
      service: ollama

  llm:
    extends:
      file: compose.ollama.yaml
      service: llm

  ollama-prepare:
    extends:
      file: compose.ollama.yaml
      service: ollama-prepare

networks:
  coldsafe-llm:
    internal: true
  coldsafe-llm-download:
    internal: false

volumes:
  job-artifacts:
  training-artifacts:
  ollama-data:
