worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Query strings can contain private data; log only the path.
    log_format paths '$remote_addr $request_method $uri $status';
    access_log /dev/stdout paths;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream api_backend {
        zone api_backend 64k;
        server backend:8000 resolve;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 256k;

        location ~ ^/(api/|health/|docs(?:/|$)|redoc(?:/|$)|openapi\.json$) {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        location ~ /\. { return 404; }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
