# Opt-in after compose.yaml + compose.jobs.yaml. Prepare weights before starting.
services:
  ollama:
    image: ollama/ollama:0.40.3
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_CONTEXT_LENGTH: "1024"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_VULKAN: "0"
    volumes:
      - "ollama-data:/models:ro"
    networks:
      - coldsafe-llm
    mem_limit: 3328m
    cpus: 4.0
    read_only: true
    tmpfs:
      - "/tmp:rw,nosuid,size=64m"
      - "/root/.ollama:rw,noexec,nosuid,size=1m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ollama-prepare:
    image: ollama/ollama:0.40.3
    profiles: [llm-setup]
    restart: "no"
    entrypoint: [/bin/sh, /prepare.sh]
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - "ollama-data:/models"
      - "./infra/ollama/prepare.sh:/prepare.sh:ro"
    networks:
      - coldsafe-llm-download
    mem_limit: 256m
    cpus: 1.0
    read_only: true
    tmpfs:
      - "/tmp:rw,nosuid,size=64m"
      - "/root/.ollama:rw,noexec,nosuid,size=1m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    environment:
      OLLAMA_URL: http://ollama:11434
    networks:
      - coldsafe-llm
  generation:
    environment:
      OLLAMA_URL: http://ollama:11434
    networks:
      - coldsafe-llm
  training:
    environment:
      OLLAMA_URL: http://ollama:11434
    networks:
      - coldsafe-llm
  llm:
    extends:
      file: compose.yaml
      service: backend
    command: [python, -m, backend.app.llm_worker]
    environment:
      OLLAMA_URL: http://ollama:11434
    networks:
      - coldsafe-llm
    depends_on:
      backend:
        condition: service_healthy
      ollama:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      disable: true

networks:
  coldsafe-llm:
    internal: true
  coldsafe-llm-download:
    internal: false

volumes:
  ollama-data:
