name: coldsafe

services:
  rabbitmq-init:
    image: coldsafe-rabbitmq-init:3.13.15
    build:
      context: ./infra/rabbitmq
      dockerfile: Bootstrap.Dockerfile
    restart: "no"
    network_mode: none
    environment:
      RABBITMQ_GATEWAY_PASSWORD: "${RABBITMQ_GATEWAY_PASSWORD:?Preencha RABBITMQ_GATEWAY_PASSWORD}"
      RABBITMQ_WRITER_PASSWORD: "${RABBITMQ_WRITER_PASSWORD:?Preencha RABBITMQ_WRITER_PASSWORD}"
      RABBITMQ_INFERENCE_PASSWORD: "${RABBITMQ_INFERENCE_PASSWORD:?Preencha RABBITMQ_INFERENCE_PASSWORD}"
      RABBITMQ_DELIVERY_PASSWORD: "${RABBITMQ_DELIVERY_PASSWORD:?Preencha RABBITMQ_DELIVERY_PASSWORD}"
      RABBITMQ_COMMANDS_PASSWORD: "${RABBITMQ_COMMANDS_PASSWORD:?Preencha RABBITMQ_COMMANDS_PASSWORD}"
      RABBITMQ_GENERATION_PASSWORD: "${RABBITMQ_GENERATION_PASSWORD:?Preencha RABBITMQ_GENERATION_PASSWORD}"
      RABBITMQ_TRAINING_PASSWORD: "${RABBITMQ_TRAINING_PASSWORD:?Preencha RABBITMQ_TRAINING_PASSWORD}"
      RABBITMQ_OBSERVABILITY_PASSWORD: "${RABBITMQ_OBSERVABILITY_PASSWORD:?Preencha RABBITMQ_OBSERVABILITY_PASSWORD}"
      RABBITMQ_API_PASSWORD: "${RABBITMQ_API_PASSWORD:?Preencha RABBITMQ_API_PASSWORD}"
      RABBITMQ_AUDIT_PASSWORD: "${RABBITMQ_AUDIT_PASSWORD:?Preencha RABBITMQ_AUDIT_PASSWORD}"
      RABBITMQ_MONITOR_PASSWORD: "${RABBITMQ_MONITOR_PASSWORD:?Preencha RABBITMQ_MONITOR_PASSWORD}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chown 0:0 /output
        python /bootstrap/bootstrap.py /output/definitions.json
        chown -R 100:101 /output
        chmod 0750 /output
    volumes:
      - "rabbitmq-definitions:/output"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    mem_limit: 64m

  rabbitmq:
    image: coldsafe-rabbitmq:4.3.6-management-alpine
    build:
      context: ./infra/rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
    volumes:
      - "rabbitmq-definitions:/etc/rabbitmq/bootstrap:ro"
      - "rabbitmq-data:/var/lib/rabbitmq"
    networks:
      - coldsafe-internal
    mem_limit: 512m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 20s

  mosquitto-init:
    image: coldsafe-mosquitto:2.0.22
    build:
      context: ./infra/mosquitto
    restart: "no"
    network_mode: none
    environment:
      MQTT_BACKEND_PASSWORD: "${MQTT_BACKEND_PASSWORD:?Preencha MQTT_BACKEND_PASSWORD no arquivo .env}"
      MQTT_DEVICE_PASSWORD: "${MQTT_DEVICE_PASSWORD:?Preencha MQTT_DEVICE_PASSWORD no arquivo .env}"
      MQTT_DEVICE_02_PASSWORD: "${MQTT_DEVICE_02_PASSWORD:?Preencha MQTT_DEVICE_02_PASSWORD no arquivo .env}"
      MQTT_GATEWAY_PASSWORD: "${MQTT_GATEWAY_PASSWORD:-}"
      MQTT_SIMULATOR_PASSWORD: "${MQTT_SIMULATOR_PASSWORD:-}"
      MQTT_SIMULATOR_OPERATOR_PASSWORD: "${MQTT_SIMULATOR_OPERATOR_PASSWORD:-}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        rm -f /tmp/passwords
        mosquitto_passwd -b -c /tmp/passwords coldsafe-backend "$${MQTT_BACKEND_PASSWORD}"
        mosquitto_passwd -b /tmp/passwords coldsafe-device "$${MQTT_DEVICE_PASSWORD}"
        mosquitto_passwd -b /tmp/passwords coldsafe-device-02 "$${MQTT_DEVICE_02_PASSWORD}"
        if [ -n "$${MQTT_GATEWAY_PASSWORD}" ]; then
          mosquitto_passwd -b /tmp/passwords coldsafe-gateway "$${MQTT_GATEWAY_PASSWORD}"
        fi
        if [ -n "$${MQTT_SIMULATOR_PASSWORD}" ]; then
          mosquitto_passwd -b /tmp/passwords sim-lab-01 "$${MQTT_SIMULATOR_PASSWORD}"
        fi
        if [ -n "$${MQTT_SIMULATOR_OPERATOR_PASSWORD}" ]; then
          mosquitto_passwd -b /tmp/passwords coldsafe-simulator-operator "$${MQTT_SIMULATOR_OPERATOR_PASSWORD}"
        fi
        install -m 0600 /tmp/passwords /mosquitto/auth/passwords
        install -m 0600 /bootstrap/acl /mosquitto/auth/acl
        chown 1883:1883 /mosquitto/auth/passwords /mosquitto/auth/acl
    volumes:
      - "mosquitto-auth:/mosquitto/auth"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=1m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN

  mosquitto:
    image: coldsafe-mosquitto:2.0.22
    build:
      context: ./infra/mosquitto
    user: "1883:1883"
    read_only: true
    restart: unless-stopped
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    environment:
      MQTT_BACKEND_USERNAME: coldsafe-backend
      MQTT_BACKEND_PASSWORD: "${MQTT_BACKEND_PASSWORD:?Preencha MQTT_BACKEND_PASSWORD no arquivo .env}"
    volumes:
      - "mosquitto-auth:/mosquitto/auth:ro"
      - "mosquitto-data:/mosquitto/data"
    networks:
      - coldsafe-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h 127.0.0.1 -p 1883
          -u "$${MQTT_BACKEND_USERNAME}" -P "$${MQTT_BACKEND_PASSWORD}"
          -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 5s

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    profiles: ["simulator"]
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_SIMULATOR_PASSWORD: "${MQTT_SIMULATOR_PASSWORD:-}"
      SIMULATOR_INTERVAL_SECONDS: "${SIMULATOR_INTERVAL_SECONDS:-1}"
      SIMULATOR_STEP_SECONDS: "${SIMULATOR_STEP_SECONDS:-1}"
    volumes:
      - type: bind
        source: "${SIMULATOR_CATALOG_DIR:-./simulator/local}"
        target: /catalog
        read_only: true
        bind:
          create_host_path: false
    networks:
      - coldsafe-internal
    user: "65532:65532"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.25

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    profiles: ["aiot"]
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_GATEWAY_PASSWORD: "${MQTT_GATEWAY_PASSWORD:-}"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_GATEWAY_PASSWORD: "${RABBITMQ_GATEWAY_PASSWORD}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-coldsafe}"
      POSTGRES_USER: "${POSTGRES_USER:-coldsafe}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      GATEWAY_OWNER_USER_ID: "${GATEWAY_OWNER_USER_ID:-}"
    volumes:
      - type: bind
        source: "${SIMULATOR_CATALOG_DIR:-./simulator/local}"
        target: /catalog
        read_only: true
        bind:
          create_host_path: false
      - "gateway-state:/state"
    networks:
      - coldsafe-internal
    user: "65532:65532"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25

  writer:
    build:
      context: .
      dockerfile: writer/Dockerfile
    profiles: ["aiot"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_WRITER_PASSWORD: "${RABBITMQ_WRITER_PASSWORD}"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: "${DOCKER_INFLUXDB_INIT_ORG:-coldsafe}"
      INFLUXDB_LIVE_BUCKET: telemetry_live
      INFLUXDB_WRITER_TOKEN: "${INFLUXDB_WRITER_TOKEN:-}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-coldsafe}"
      POSTGRES_USER: "${POSTGRES_USER:-coldsafe}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      WRITER_OWNER_USER_ID: "${WRITER_OWNER_USER_ID:-}"
    volumes:
      - type: bind
        source: "${SIMULATOR_CATALOG_DIR:-./simulator/local}"
        target: /catalog
        read_only: true
        bind:
          create_host_path: false
    networks:
      - coldsafe-internal
    user: "65532:65532"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.25

  influxdb:
    image: influxdb:2.7.12-alpine
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: "${DOCKER_INFLUXDB_INIT_MODE:-setup}"
      DOCKER_INFLUXDB_INIT_USERNAME: "${DOCKER_INFLUXDB_INIT_USERNAME:?Preencha DOCKER_INFLUXDB_INIT_USERNAME no arquivo .env}"
      DOCKER_INFLUXDB_INIT_PASSWORD: "${DOCKER_INFLUXDB_INIT_PASSWORD:?Preencha DOCKER_INFLUXDB_INIT_PASSWORD no arquivo .env}"
      DOCKER_INFLUXDB_INIT_ORG: "${DOCKER_INFLUXDB_INIT_ORG:-coldsafe}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${DOCKER_INFLUXDB_INIT_BUCKET:-telemetry}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:?Preencha DOCKER_INFLUXDB_INIT_ADMIN_TOKEN no arquivo .env}"
    volumes:
      - "influxdb-data:/var/lib/influxdb2"
      - "influxdb-config:/etc/influxdb2"
    networks:
      - coldsafe-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-coldsafe}"
      POSTGRES_USER: "${POSTGRES_USER:-coldsafe}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no arquivo .env}"
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    networks:
      - coldsafe-internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: coldsafe/v1/telemetry
      MQTT_QOS: 1
      MQTT_CLIENT_ID: coldsafe-backend
      MQTT_BACKEND_USERNAME: coldsafe-backend
      MQTT_BACKEND_PASSWORD: "${MQTT_BACKEND_PASSWORD:?Preencha MQTT_BACKEND_PASSWORD no arquivo .env}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?Preencha AUTH_JWT_SECRET com uma chave aleatoria privada de pelo menos 32 caracteres}"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: "${DOCKER_INFLUXDB_INIT_ORG:-coldsafe}"
      INFLUXDB_BUCKET: "${DOCKER_INFLUXDB_INIT_BUCKET:-telemetry}"
      INFLUXDB_TOKEN: "${INFLUXDB_TOKEN:?Preencha INFLUXDB_TOKEN no arquivo .env}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-coldsafe}"
      POSTGRES_USER: "${POSTGRES_USER:-coldsafe}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no arquivo .env}"
    networks:
      - coldsafe-internal
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      additional_contexts:
        contracts: ./contracts
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    networks:
      - coldsafe-internal
      - coldsafe-edge
    user: "101:101"
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  coldsafe-internal:
    internal: true
  coldsafe-edge:
  coldsafe-frontend:
    internal: false

volumes:
  gateway-state:
  rabbitmq-definitions:
  rabbitmq-data:
  mosquitto-auth:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  postgres-data:
  frontend-node-modules:
