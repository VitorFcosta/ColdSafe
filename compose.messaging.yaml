# Messaging metrics and private observation; keep the current dashboard.
services:
  backend:
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_MANAGEMENT_PORT: 15672
      RABBITMQ_MONITOR_PASSWORD: "${RABBITMQ_MONITOR_PASSWORD:?Preencha RABBITMQ_MONITOR_PASSWORD}"
      RABBITMQ_OBSERVABILITY_PASSWORD: "${RABBITMQ_OBSERVABILITY_PASSWORD:?Preencha RABBITMQ_OBSERVABILITY_PASSWORD}"
